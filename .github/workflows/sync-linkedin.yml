name: Sync LinkedIn Posts

on:
  schedule:
    # Runs daily at 13:00 UTC (6:00 AM Pacific Time)
    - cron: '0 13 * * *'
  # Allows Joe or admin to trigger an instant sync at any time with an optional post URL
  workflow_dispatch:
    inputs:
      post_url:
        description: 'LinkedIn Post URL to scrape (e.g. https://www.linkedin.com/posts/...)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync LinkedIn Posts
        env:
          LINKEDINSCRAPERAPI_KEY: ${{ secrets.LINKEDINSCRAPERAPI_KEY }}
          LINKEDIN_POST_URL: ${{ inputs.post_url }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_VANITY: 'kleininsight'
        run: node scripts/sync-linkedin.js

      - name: Commit and push new insights if available
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/insights/ assets/insights/
          if git diff --staged --quiet; then
            echo "No new LinkedIn posts found to commit."
          else
            git commit -m "Automated: Sync new LinkedIn posts from Joe Klein"
            git push origin main
          fi
