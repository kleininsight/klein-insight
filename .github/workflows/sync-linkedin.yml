name: Sync LinkedIn Posts

on:
  schedule:
    # Runs daily at 13:00 UTC (6:00 AM Pacific Time)
    - cron: '0 13 * * *'
  # Allows Joe or admin to trigger an instant sync at any time from GitHub Actions UI
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: 'Optional Bright Data snapshot ID (leave blank to scrape live profile)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync LinkedIn Posts via Bright Data
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          LINKEDIN_PROFILE_URL: 'https://www.linkedin.com/in/kleininsight/'
        run: node scripts/sync-linkedin.js

      - name: Commit and push new insights if available
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/insights/ assets/insights/
          if git diff --staged --quiet; then
            echo "No new LinkedIn posts found to commit."
          else
            echo "New posts detected! Compiling static pages..."
            npm run build
            git add insights/ feed.xml sitemap.xml
            git commit -m "Automated: Sync new LinkedIn posts from Joe Klein via Bright Data"
            git push origin main
          fi

